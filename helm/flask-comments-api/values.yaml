namespace: flask-demo

app:
  name: flask-comments-api

image:
  repository: larustus/flask-comments-api
  tag: "3.0"
  pullPolicy: Always

replicaCount: 1

container:
  port: 5000

service:
  type: NodePort
  port: 5000
  targetPort: 5000
  nodePort: 30080

config:
  DB_PATH: /data/comments.db

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data
