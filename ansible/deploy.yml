---
- name: Deploy Flask Comments API to EC2
  hosts: ec2
  become: true

  vars:
    project_dir: /home/ubuntu/aws-demo
    repo_url: https://github.com/larustus/aws-demo.git
    repo_branch: ansible-deploy
    compose_dir: /home/ubuntu/aws-demo/deploy/ec2
    aws_region: eu-north-1
    ecr_registry: 340528523115.dkr.ecr.eu-north-1.amazonaws.com

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install required packages
      apt:
        name:
          - git
          - docker.io
          - curl
          - unzip
          - ca-certificates
        state: present

    - name: Ensure Docker service is enabled and running
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_cli_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_cli_check.rc != 0

    - name: Unzip AWS CLI installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: aws_cli_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      when: aws_cli_check.rc != 0

    - name: Ensure Docker Compose v2 is installed
      apt:
        name: docker-compose-v2
        state: present

    - name: Clone or update application repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Log in Docker to AWS ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
          | docker login --username AWS --password-stdin {{ ecr_registry }}
      args:
        executable: /bin/bash

    - name: Pull latest image from ECR using Docker Compose
      command: docker compose pull
      args:
        chdir: "{{ compose_dir }}"

    - name: Start application using Docker Compose
      command: docker compose up -d
      args:
        chdir: "{{ compose_dir }}"

    - name: Show Docker Compose status
      command: docker compose ps
      args:
        chdir: "{{ compose_dir }}"
      register: compose_status
      changed_when: false

    - name: Print Docker Compose status
      debug:
        var: compose_status.stdout_lines
